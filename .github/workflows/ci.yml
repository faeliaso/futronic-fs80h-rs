name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.71", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb development files
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo +${{ matrix.toolchain }} fmt --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --all-targets -- -D warnings
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --all-targets

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb development files
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Verify the publishable package
        run: cargo publish --dry-run
