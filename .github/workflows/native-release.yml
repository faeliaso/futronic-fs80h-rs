name: Native release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - name: Validate Rust quality
        run: |
          cargo fmt --check
          cargo check
          cargo test
          cargo clippy -- -D warnings
      - name: Install Linux libusb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: Build native ABI
        run: cargo build --release --target ${{ matrix.target }} --features native,lfd-experimental-decision
      - name: Verify Rust ABI tests
        run: cargo test --features native,lfd-experimental-decision --lib
      - name: Verify C header and linking (Unix)
        if: runner.os != 'Windows'
        run: cc -Iinclude examples/native_smoke.c -Ltarget/${{ matrix.target }}/release -lfutronic_fs80h_rs -o native-smoke
      - name: Upload raw library for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: futronic-fs80h-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/*.dylib
            target/${{ matrix.target }}/release/*.so
            target/${{ matrix.target }}/release/*.dll
            target/${{ matrix.target }}/release/*.lib
            include/futronic_fs80h.h
            README.md
            README_EN.md
            EXAMPLES.md
            LICENSE

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release }
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**
