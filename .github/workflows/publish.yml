name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH to upload the version from the selected v* tag."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      inputs.confirmation == 'PUBLISH'
    environment: crates-io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb development files
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo pkgid | sed 's/.*#//')"
          test "$tag_version" = "$package_version"
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
