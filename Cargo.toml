[package]
name = "futronic-fs80h-rs"
version = "0.1.0"
edition = "2021"
description = "Pure Rust userspace USB driver for Futronic FS80H and FS81H fingerprint scanners."
license = "MIT"
readme = "README.md"
keywords = ["biometrics", "fingerprint", "usb", "futronic", "driver", "wsq"]
categories = ["hardware-support"]

[features]
default = ["wsq", "templates", "ansi-378", "matcher", "matcher-base64"]
wsq = ["dep:cc"]
templates = ["dep:fprint-mindtct"]
ansi-378 = ["templates"]
matcher = ["templates"]
matcher-base64 = ["matcher", "dep:base64"]
# Links against an externally installed NIST NFIQ2 2.3 library. Set `NFIQ2_DIR`
# to its installation prefix when enabling this feature.
nfiq2 = ["dep:cc"]

[dependencies]
rusb = "0.9"
thiserror = "1.0"
tracing = { version = "0.1", default-features = false }
fprint-mindtct = { version = "0.1", optional = true, features = ["unstable-diagnostics"] }
base64 = { version = "0.22", optional = true }

[build-dependencies]
cc = { version = "1.0", optional = true }

[[example]]
name = "capture_to_wsq"
required-features = ["wsq"]

[[example]]
name = "capture_to_iso_template"
required-features = ["templates"]

[[example]]
name = "capture_to_ansi_template"
required-features = ["ansi-378"]

[[example]]
name = "verify_live_match"
required-features = ["matcher"]

[[example]]
name = "calibrate_live_match"
required-features = ["matcher"]

[[example]]
name = "capture_with_nfiq2_quality"
required-features = ["nfiq2"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
