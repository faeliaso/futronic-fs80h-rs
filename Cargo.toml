[package]
name = "futronic-fs80h-rs"
version = "0.1.0"
edition = "2021"
description = "Pure Rust userspace USB driver for Futronic FS80H and FS81H fingerprint scanners."
license = "MIT"
readme = "README.md"
keywords = ["biometrics", "fingerprint", "usb", "futronic", "driver", "wsq"]
categories = ["hardware-support"]

[features]
default = ["wsq"]
wsq = ["dep:cc"]

[dependencies]
rusb = "0.9"
thiserror = "1.0"
tracing = { version = "0.1", default-features = false }

[build-dependencies]
cc = { version = "1.0", optional = true }

[[example]]
name = "capture_to_wsq"
required-features = ["wsq"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
